<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szövegformázs: FONT (betűtípus, betűméret és szín)</title>
</head>
<body>
    <h2>Szövegformázs: FONT (betűtípus, betűméret és szín)</h2>
    <p style="font-size: 24px;">
        <span style="font-family: Arial, Verdana, Tahoma, 'Courier New', sans-serif;">
            Ebben a szövegben
        </span>
        <strong style="color: blue;">lesznek</strong> nagyobb betűk,
        <span style="font-size: 12px;"> lesznek kisebb betűk is,</span> illetbe 
        <strong style="color: #ff3333;">lesznek színes szövegrészek</strong>is.
    </p>
    <p>
        <span style="font-family: 'Courier New', Courier, monospace; font-size: 24; color: #009999;">
            123456789 <br>
            asd&nbsp;&nbsp;&nbsp;&nbsp;EFghi
        </span>
    </p>
</body>
</html>
